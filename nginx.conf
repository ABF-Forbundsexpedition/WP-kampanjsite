server {
    server_name <sitename>;
    listen 80;
    listen [::]:80;

    client_max_body_size 129M;

    # WordPress xmlrpc används inte och är ett vanligt attackmål
    location = /xmlrpc.php {
        return 403;
    }

    location = /wp-login.php {
        limit_req zone=wplogin burst=5 nodelay;
        proxy_pass http://127.0.0.1:<port>;
        include snippets/wp-kampanjsite-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:<port>;
        include snippets/wp-kampanjsite-proxy.conf;
    }
}
